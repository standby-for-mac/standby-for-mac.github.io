<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StandBy</title>
<style>
:root{--text:#fff;--dim:#ffffffa6;--line:#ffffff26;--accent:#ff6482;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-night="1"] .split{background:#000}
[data-night="1"]{--text:#ff3b30;--dim:#ff3b3066;--line:#ff3b3022;--accent:#ff3b30}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--text);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s}
.page.on{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.4s,filter .8s}
[data-night="1"] .bg{filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(5) brightness(.4)}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom left,#0000004d,#0000 45%),linear-gradient(to top,#0006,#0000 30%)}
.pclock{position:absolute;top:3vmin;right:5.5vmin;text-align:right}
.pclock .t{font-size:21vmin;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:#fffffff0;text-shadow:0 .4vmin 4vmin #0000004d}
[data-night="1"] .pclock .t{color:var(--text)}
.pclock .d{margin:.4vmin .8vmin 0 0;font-size:3vmin;font-weight:500;color:#ffffffd9;letter-spacing:.01em;text-shadow:0 .3vmin 2vmin #0006}
.split{background:radial-gradient(120% 90% at 85% 0%,#3d2b80 0%,#171b40 45%,#090a14 100%);display:grid;grid-template-columns:1.6fr 1fr;align-items:center;padding:0 7vmin;gap:0}
.split>div{height:100%;display:flex;flex-direction:column;justify-content:center}
.split>div+div{border-left:1px solid var(--line);padding-left:6vmin}
.split .l{padding-right:5vmin}
.eyebrow{color:var(--accent);font-size:2.4vmin;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1vmin}
.big{font-size:28vmin;font-weight:700;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.sub{font-size:3.6vmin;font-weight:400;color:var(--dim);margin-top:2.4vmin;letter-spacing:.01em}
.mon{font-size:3.4vmin;font-weight:600;margin-bottom:2.4vmin}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.4vmin;text-align:center;font-size:2.7vmin;font-weight:400;font-variant-numeric:tabular-nums}
.cal b{color:var(--dim);font-weight:500;font-size:2vmin;padding-bottom:1vmin}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .today{background:var(--accent);color:#fff;font-weight:700}
svg.analog{width:100%;max-height:84vmin}
.hand{stroke-linecap:round}
.dnum{font-size:42vmin;font-weight:700;letter-spacing:-.05em;color:var(--accent);line-height:.9;font-variant-numeric:tabular-nums}
.pill{all:unset;cursor:pointer;font-size:3vmin;font-weight:600;padding:1.6vmin 3.4vmin;border-radius:4vmin;background:#ffffff26;margin:0 1.2vmin 1.4vmin 0;display:inline-block;color:#fff}.pill:hover{background:#ffffff40}.pill.pri{background:var(--accent)}
#bat{position:fixed;top:max(3.4vmin,env(safe-area-inset-top));left:4.5vmin;z-index:4;display:none;align-items:center;gap:.9vmin;font-size:2.6vmin;font-weight:600;font-variant-numeric:tabular-nums;color:#fffffff0;text-shadow:0 .2vmin 1.5vmin #0006}
[data-night="1"] #bat{color:var(--text)}
#bat svg{width:4.4vmin;height:2.3vmin}
#ui{position:fixed;left:50%;bottom:2.4vmin;transform:translateX(-50%);display:flex;gap:.4vmin;align-items:center;padding:.6vmin 1vmin;border-radius:5vmin;background:#1c1c1e99;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 1px #ffffff1f,0 1vmin 5vmin #0006;opacity:0;transition:opacity .4s;z-index:5}
body.show #ui{opacity:1}body:not(.show){cursor:none}
#ui button,#ui label{all:unset;cursor:pointer;color:#fff;font-size:max(12px,1.7vmin);font-weight:500;padding:.9vmin 1.6vmin;border-radius:3vmin}
#ui button:hover,#ui label:hover{background:#ffffff26}
#ui .dot{width:1vmin;height:1vmin;min-width:7px;min-height:7px;padding:0;margin:0 .5vmin;border-radius:50%;background:#ffffff59}
#ui .dot.on{background:#fff}
@media (orientation:portrait){.split{grid-template-columns:1fr;padding:6vmin}.split>div+div{border:0;padding:0}.split .l{padding:0}}
</style>
</head>
<body class="show">
<div class="page on" id="p0">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB" style="opacity:0"></div><div class="shade"></div>
  <div class="pclock"><div class="t" id="pclock"></div><div class="d" id="pdate"></div></div>
</div>
<div class="page split" id="p1">
  <div class="l"><div class="eyebrow" id="wd"></div><div class="big" id="clock">--:--</div><div class="sub" id="date"></div></div>
  <div><div class="mon" id="mon"></div><div class="cal" id="cal"></div></div>
</div>
<div class="page split" id="p2">
  <div class="l"><svg class="analog" id="an" viewBox="-100 -100 200 200"></svg></div>
  <div><div class="eyebrow" id="dname"></div><div class="dnum" id="dnum"></div><div class="sub" id="dmon"></div></div>
</div>
<div class="page split" id="p3">
  <div class="l"><div class="eyebrow">Timer</div><div class="big" id="tm">05:00</div></div>
  <div><div><button class="pill" data-m="1">1 min</button><button class="pill" data-m="5">5 min</button><button class="pill" data-m="10">10 min</button><button class="pill" data-m="15">15 min</button><button class="pill" data-m="25">25 min</button></div><div style="margin-top:2vmin"><button class="pill pri" id="tgo">Start</button><button class="pill" id="trs">Reset</button></div></div>
</div>
<div id="bat"><svg viewBox="0 0 26 13"><rect x=".7" y=".7" width="21.6" height="11.6" rx="3.4" fill="none" stroke="currentColor" opacity=".5" stroke-width="1.2"/><rect id="bf" x="2.2" y="2.2" width="18.6" height="8.6" rx="2.2" fill="currentColor"/><path d="M23.5 4.5v4c.9-.3 1.6-1.1 1.6-2s-.7-1.7-1.6-2z" fill="currentColor" opacity=".5"/></svg><span id="bp">--%</span><span id="bz" style="display:none">⚡︎</span></div>
<div id="ui">
  <button id="b0" class="dot"></button><button id="b1" class="dot"></button><button id="b2" class="dot"></button><button id="b3" class="dot"></button>
  <button id="night">Night</button><button id="h24">12/24h</button><button id="fs">Full screen</button>
  <button id="alb">Album: Cat</button><label for="files">Choose Dropbox folder…</label><input id="files" type="file" accept="image/*" webkitdirectory multiple hidden>
</div>

}
function cal(d){
  $('mon').textContent=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let o='';['S','M','T','W','T','F','S'].forEach(x=>o+=`<b>${x}</b>`);
  const f=new Date(d.getFullYear(),d.getMonth(),1).getDay(),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  for(let i=0;i<f;i++)o+='<span></span>';
  for(let i=1;i<=n;i++)o+=`<span class="${i===d.getDate()?'today':''}">${i}</span>`;
  $('cal').innerHTML=o;
}
function showPhoto(){const a=$('bgA'),b=$('bgB'),next=front?a:b,cur=front?b:a;next.style.backgroundImage=`url(${photos[pi]})`;next.style.opacity=1;cur.style.opacity=0;front=1-front}
let albums={Cat:photos},names=['Cat'],ai=0;
function useAlbum(){const k=names[ai];photos=k==='All photos'?Object.values(albums).flat():albums[k];pi=0;showPhoto();$('alb').textContent='Album: '+k}
$('files').onchange=e=>{const g={};[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>{const p=(f.webkitRelativePath||f.name).split('/'),k=p.length>2?p[1]:p[0];(g[k]=g[k]||[]).push(URL.createObjectURL(f))});const ks=Object.keys(g);if(!ks.length)return;albums=g;names=ks.length>1?['All photos',...ks]:ks;ai=0;useAlbum();setPage(0)};
$('alb').onclick=()=>{ai=(ai+1)%names.length;useAlbum()};
setInterval(()=>{if(photos.length>1){pi=(pi+1)%photos.length;showPhoto()}},120000);
$('night').onclick=()=>{night=1-night;setNight()};
$('h24').onclick=()=>{h24=1-h24;save();tick()};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
[0,1,2,3].forEach(i=>$('b'+i).onclick=()=>setPage(i));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1);if(e.key==='n')$('night').click();if(e.key==='f')$('fs').click()});
let x0=null;addEventListener('pointerdown',e=>x0=e.clientX);addEventListener('pointerup',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>60&&!e.target.closest('#ui'))setPage(page+(e.clientX<x0?1:-1));x0=null});
let hide;addEventListener('pointermove',()=>{document.body.classList.add('show');clearTimeout(hide);hide=setTimeout(()=>document.body.classList.remove('show'),3000)});
hide=setTimeout(()=>document.body.classList.remove('show'),4000);
if(navigator.getBattery){navigator.getBattery().then(b=>{const u=()=>{const p=Math.round(b.level*100);$('bp').textContent=p+'%';$('bf').setAttribute('width',Math.max(1.5,18.6*b.level));$('bf').style.color=b.charging?'#30d158':p<=20?'#ff453a':'inherit';$('bz').style.display=b.charging?'inline':'none';$('bat').style.display='flex'};u();['levelchange','chargingchange'].forEach(e=>b.addEventListener(e,u))}).catch(()=>{})}
let tmSet=300,tmLeft=300,tmEnd=0,tmRun=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tmR(){$('tm').textContent=fmt(Math.max(0,Math.ceil(tmLeft)));$('tgo').textContent=tmRun?'Pause':'Start'}
function beep(){try{const c=new AudioContext();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start(c.currentTime+d);o.stop(c.currentTime+d+.2)})}catch(e){}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tmSet=tmLeft=+b.dataset.m*60;tmRun=false;tmR()});
$('tgo').onclick=()=>{if(tmRun){tmLeft=(tmEnd-Date.now())/1000;tmRun=false}else if(tmLeft>0){tmEnd=Date.now()+tmLeft*1000;tmRun=true}tmR()};
$('trs').onclick=()=>{tmLeft=tmSet;tmRun=false;tmR()};
setInterval(()=>{if(!tmRun)return;tmLeft=(tmEnd-Date.now())/1000;if(tmLeft<=0){tmLeft=0;tmRun=false;beep()}tmR()},250);
tmR();
setNight();setPage(page);showPhoto();tick();setInterval(tick,1000);
</script>
</body>
</html>
